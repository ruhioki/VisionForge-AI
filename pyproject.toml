[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionforge-ai"
version = "0.1.0"
description = "A learning-focused Python computer vision project."
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
visionforge = "visionforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
